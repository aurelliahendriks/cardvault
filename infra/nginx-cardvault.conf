# CardVault :: the front door on your VPS
#
# Goes in /etc/nginx/sites-available/cardvault, symlinked into sites-enabled.
#
# ---------------------------------------------------------------------------
# WHAT THIS MACHINE IS AND IS NOT DOING
# ---------------------------------------------------------------------------
#
# It is NOT running CardVault. The droplet has 362 MB of memory free, one vCPU and no swap;
# Postgres with pgvector, Redis and Node would swap themselves to a standstill on it, and the
# photographs need disk it does not have.
#
# It is a DOORWAY. All it does is terminate TLS and forward bytes to a tunnel that your PC
# opened outward to this machine. nginx and sshd are already running here for other reasons,
# so the marginal cost of this is close to zero memory — which is exactly why a VPS that
# cannot host the app can still solve the problem the app actually has: a permanent address.
#
# The traffic path:
#
#   phone  --https-->  this VPS :443  --plain-->  127.0.0.1:8090
#                                                       |
#                                        (ssh reverse tunnel, opened BY the PC)
#                                                       v
#                                              your PC  localhost:8080
#
# The PC dials out, so nothing has to be forwarded on your home router and your home IP is
# never published. Port 8090 is bound to 127.0.0.1 on this machine only (sshd's default,
# `GatewayPorts no`), so nobody on the internet can reach the tunnel directly — everything
# has to come through nginx and therefore through TLS.
#
# Deliberately left alone: your existing port 80 site and the trading bot on 8080. This is a
# new server block on a new hostname; nothing above is touched.

# The IPv6 `listen [::]:...` lines are commented out deliberately.
#
# nginx has no "bind if the address family exists" option: on a droplet without IPv6 enabled
# they fail with `socket() [::]:80 failed (97: Address family not supported by protocol)` and
# nginx REFUSES TO START — which takes your existing port 80 site down with it, over a feature
# you were not using. Uncomment both pairs only after `ip -6 addr` shows a global address.

server {
    listen 80;
    # listen [::]:80;
    server_name CARDVAULT_HOST;          # e.g. ibicards.duckdns.org

    # certbot writes its challenge files here and needs plain http to serve them, so this
    # location must stay reachable over http forever - not just during the first issue.
    # Certificates renew every 60 days and a redirect-everything rule breaks that silently,
    # three months later, on a machine you have stopped thinking about.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    # HTTP/2 is written the old way on purpose. Ubuntu 24.04 ships nginx 1.24, where the
    # modern `http2 on;` directive does not exist yet and `nginx -t` fails with the
    # thoroughly unhelpful `unknown directive "http2"`. This form works on 1.24 and still
    # works on 1.25+, where it only logs a deprecation notice. On nginx 1.25 or newer you may
    # drop `http2` from these two lines and add `http2 on;` below them instead.
    listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name CARDVAULT_HOST;

    # certbot --nginx fills these in. Left as placeholders so `nginx -t` tells you plainly
    # that you have not run certbot yet, rather than starting without TLS and looking fine.
    ssl_certificate     /etc/letsencrypt/live/CARDVAULT_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CARDVAULT_HOST/privkey.pem;

    # ---------------------------------------------------------------------
    # 20 megabytes, and this one is load-bearing
    # ---------------------------------------------------------------------
    #
    # nginx defaults to 1 MB. A photograph is posted as a base64 data URL, which is about a
    # third larger than the file, so an 8 MB photo arrives as roughly 11 MB of JSON. With the
    # default, every card photo taken on a phone would fail with a bare `413 Request Entity
    # Too Large` — and the app would report "Upload failed", which sounds like the app's
    # fault. 20m matches the `bodyLimit` Fastify is already configured with, so the two
    # agree and the app gets to produce the useful error message instead of nginx.
    client_max_body_size 20m;

    # Photographs travel over a home upload link, which is the slow direction. The default
    # 60s read timeout is generous for JSON and tight for an 11 MB body on 5 Mbps upstream.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_request_buffering off;   # stream it through rather than spooling to the VPS disk

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Without this the app sees plain http, decides the connection is insecure, and drops
        # `Secure` from the session cookie. It would still work - and it would quietly
        # downgrade every login on the internet-facing address.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # A friendlier answer than nginx's default when the PC is asleep or the tunnel has
        # dropped. Without it you get "502 Bad Gateway" and no idea which machine is at fault.
        proxy_intercept_errors on;
        error_page 502 504 = @asleep;
    }

    location @asleep {
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CardVault is asleep</title>
<body style="font-family:system-ui;background:#0d0d0d;color:#e8e7e0;padding:44px 22px;text-align:center">
<h1 style="font-size:20px">CardVault is asleep</h1>
<p style="color:#898781;line-height:1.6">The PC at home is off, or has not reconnected yet.<br>
It comes back on its own a few seconds after the PC wakes up.</p>
</body>';
    }
}
